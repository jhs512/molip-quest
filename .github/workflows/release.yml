name: Release installers

# Every push to main publishes a GitHub Release carrying the Windows x64 installer,
# the macOS Apple Silicon disk image and the Android view-only APK. The release job
# refuses to publish unless all three were built and pass the container checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The executables learn their own build number (the release tag's "build.N") so the app can
# tell when a newer release exists (src/updater.rs).
env:
  MOLIP_BUILD: ${{ github.run_number }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release executable
        run: cargo build --release --locked --bin molip-quest
      - name: Verify Windows update helper
        run: cargo test --locked --lib updater::tests
      - name: Verify Windows learning environment installation
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          cargo test --locked --lib doctor::install_tests -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Learning environment installation failed.' }
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Verify installation and uninstallation
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'molip-install-check'
          $installer = Start-Process target/installers/molip-quest-windows-x64-setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath") -Wait -PassThru
          if ($installer.ExitCode -ne 0 -or !(Test-Path "$installPath/molip-quest.exe")) { throw 'Installation failed.' }
          $uninstaller = Start-Process "$installPath/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw 'Uninstallation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: target/installers/molip-quest-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    # macos-latest is an Apple Silicon runner, so this produces an arm64 build.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Developer ID signing and notarization run only when these secrets are set:
      # APPLE_CERTIFICATE_P12_BASE64 (Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password). Otherwise the
      # bundle is ad-hoc signed and the first launch needs System Settings → 그래도 열기.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release executable
        run: cargo build --release --locked --bin molip-quest
      - name: Import the Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain=$RUNNER_TEMP/signing.keychain-db
          keychain_password=$(uuidgen)
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          test -n "$identity" || { echo 'No Developer ID Application identity in the certificate'; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Assemble app bundle and disk image
        run: bash packaging/macos/bundle.sh
      - name: Notarize and staple the disk image
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit target/installers/molip-quest-macos-arm64.dmg             --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple target/installers/molip-quest-macos-arm64.dmg
      - name: Verify the bundle launches from the disk image
        run: |
          set -euo pipefail
          hdiutil attach target/installers/molip-quest-macos-arm64.dmg -mountpoint /Volumes/molip-check -nobrowse
          test -x "/Volumes/molip-check/몰입 퀘스트.app/Contents/MacOS/molip-quest"
          file "/Volumes/molip-check/몰입 퀘스트.app/Contents/MacOS/molip-quest" | grep -q arm64
          codesign --verify --deep --strict "/Volumes/molip-check/몰입 퀘스트.app"
          # Launch it the way a student would (a copy outside the image) and require it to
          # stay up for ten seconds: a crash on start must block the release.
          ditto "/Volumes/molip-check/몰입 퀘스트.app" "$RUNNER_TEMP/몰입 퀘스트.app"
          hdiutil detach /Volumes/molip-check
          "$RUNNER_TEMP/몰입 퀘스트.app/Contents/MacOS/molip-quest" > "$RUNNER_TEMP/launch.log" 2>&1 &
          app_pid=$!
          sleep 10
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo '::error::the app exited within ten seconds of launch'
            cat "$RUNNER_TEMP/launch.log"
            exit 1
          fi
          kill "$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: target/installers/molip-quest-macos-arm64.dmg
          if-no-files-found: error

  android:
    # View-only build: concepts and quizzes work, coding missions are read and acknowledged.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DX_VERSION: v0.7.10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Dioxus CLI
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          dx --version
      - name: Restore the release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 secret is missing'; exit 1; }
          mkdir -p packaging/android
          echo "$KEYSTORE_BASE64" | base64 -d > packaging/android/release.jks
          printf '\n[bundle.android]\njks_file = "packaging/android/release.jks"\njks_password = "%s"\nkey_alias = "molip"\nkey_password = "%s"\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" >> Dioxus.toml
      - name: Build signed release APK
        run: |
          set -euo pipefail
          # The runner exports ANDROID_NDK_LATEST_HOME only into the shell, not the workflow env context.
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          dx build --android --release --target aarch64-linux-android --no-default-features --features mobile --verbose
          # dx always writes its own launcher icon; swap in ours and let Gradle reassemble the signed APK.
          gradle_app=$(dirname "$(find target/dx -path '*/android/app/app/build.gradle.kts' -print -quit)")
          python3 tools/apply-android-icon.py "$gradle_app/src/main/res"
          (cd "$gradle_app/.." && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --quiet)
          apk=$(find target/dx -name 'app-release.apk' -print -quit)
          test -n "$apk" || { echo 'No signed release APK produced'; find target/dx -name '*.apk'; exit 1; }
          mkdir -p target/installers
          cp "$apk" target/installers/molip-quest-android.apk
      - name: Verify the APK signature
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --print-certs target/installers/molip-quest-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: target/installers/molip-quest-android.apk
          if-no-files-found: error

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: target/release-assets
      - name: Require real installer containers for all three platforms
        run: python3 tools/verify-release-assets.py target/release-assets
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v${version}-build.${RUN_NUMBER}"
          subject=$(git log -1 --format=%s "$COMMIT_SHA")
          gh release create "$tag" --target "$COMMIT_SHA" --latest --title "$tag — $subject" --generate-notes \
            target/release-assets/molip-quest-windows-x64-setup.exe \
            target/release-assets/molip-quest-macos-arm64.dmg \
            target/release-assets/molip-quest-android.apk
