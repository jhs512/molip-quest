name: Prepare three-platform release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
      windows_run:
        description: Successful workflow run with release-windows-x64 artifact
        required: true
      android_run:
        description: Successful workflow run with release-android artifact
        required: true
      ios_run:
        description: Successful workflow run with release-ios artifact
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all required platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          ANDROID_RUN: ${{ inputs.android_run }}
          IOS_RUN: ${{ inputs.ios_run }}
        run: |
          set -euo pipefail
          gh run download "$WINDOWS_RUN" --name release-windows-x64 --dir target/release-assets
          gh run download "$ANDROID_RUN" --name release-android --dir target/release-assets
          gh run download "$IOS_RUN" --name release-ios --dir target/release-assets
      - name: Require real installer containers for all three platforms
        run: python3 tools/verify-release-assets.py target/release-assets
      - name: Create draft with all three installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
            target/release-assets/molip-quest-windows-x64-setup.exe \
            target/release-assets/molip-quest-android.apk \
            target/release-assets/molip-quest-ios.ipa
