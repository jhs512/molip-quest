[package]
name = "molip-quest"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "molip-server"
path = "src/bin/server.rs"

[[bin]]
name = "molip-quest"
path = "src/main.rs"
