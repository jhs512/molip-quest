[package]
name = "molip-quest"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
arboard = { version = "3.6.1", default-features = false }
pulldown-cmark = "0.13"
ammonia = "4"

[[bin]]
name = "molip-quest"
path = "src/main.rs"
