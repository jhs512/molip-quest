<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>몰입 퀘스트 클래스룸 참여</title>
<style>body{font:16px system-ui;background:#f5f7f5;color:#173d36}main{max-width:460px;margin:8vh auto;background:white;border:1px solid #dce5df;border-radius:18px;padding:32px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #bdcdc2;border-radius:8px;font:inherit}button{background:#236b55;color:white;cursor:pointer}p{line-height:1.7}#message{white-space:pre-wrap}</style>
<main><h1>몰입 퀘스트</h1><h2>클래스룸 참여</h2><p>학생 계정으로 로그인하면 이 링크의 클래스룸에 참여합니다. 이후 설치한 앱에서 같은 계정으로 로그인하세요.</p>
<form id="form"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><button id="login" type="submit">로그인하고 참여</button></form><button id="register">학생 계정 만들기</button><p id="message" role="status"></p></main>
<script>
const invite=location.pathname.split('/').filter(Boolean).at(-1);
const message=document.querySelector('#message');
async function request(path,body,token){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'요청 실패');return data;}
function credentials(){return {email:document.querySelector('#email').value,password:document.querySelector('#password').value};}
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const auth=await request('/api/login',credentials());await request('/api/join',{invite},auth.token);await request('/api/logout',{},auth.token);message.textContent='참여했습니다. 설치한 앱에서 같은 계정으로 로그인하면 클래스룸이 보입니다.';}catch(error){message.textContent=error.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}};
document.querySelector('#register').onclick=async()=>{try{await request('/api/register',credentials());message.textContent='계정을 만들었습니다. 로그인하고 참여를 눌러주세요.';}catch(error){message.textContent=error.message;}};
</script></html>
